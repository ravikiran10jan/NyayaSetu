name: nyayasetu
description: Legal consultation platform for India
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.1

  # HTTP
  http: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
